<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAVEME Group — Position Draw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #c9962a;
      --gold-lt: #f0d07a;
      --dark:    #10233a;
      --dark2:   #181c26;
      --dark3:   #232838;
      --border:  rgba(201,150,42,0.25);
      --text:    #f0ece0;
      --muted:   #8a8fa8;
      --success: #2ecc71;
      --radius:  14px;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-ring {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 24px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold-lt);
    }

    header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
      width: 100%;
      max-width: 860px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── Wheel Column ── */
    .wheel-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .wheel-wrap {
      position: relative;
      width: min(88vw, 340px);
      height: auto;
      aspect-ratio: 1 / 1;
    }

    #wheelCanvas {
      border-radius: 50%;
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 24px rgba(201,150,42,0.18));
      touch-action: manipulation;
    }

    .pointer {
      position: absolute;
      top: 50%;
      right: -18px;
      transform: translateY(-50%);
      width: 0; height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-right: 32px solid #c0392b;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      z-index: 10;
    }

    .hub {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--dark2);
      border: 3px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      cursor: pointer;
      transition: background 0.2s;
    }

    .hub:hover { background: var(--dark3); }
    .hub svg { width: 24px; height: 24px; stroke: var(--gold); stroke-width: 2; fill: none; }
    .hub.spinning svg { stroke: #e74c3c; animation: rotIcon 0.6s linear infinite; }
    @keyframes rotIcon { to { transform: rotate(360deg); } }

    /* ── Result badge ── */
    .result-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 2.5rem;
      text-align: center;
      min-width: 200px;
      transition: border-color 0.4s, background 0.4s;
    }

    .result-card.revealed {
      border-color: var(--gold);
      background: rgba(201,150,42,0.08);
    }

    .result-card .rlabel {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .result-card .rvalue {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      color: var(--gold-lt);
      line-height: 1;
    }

    .result-card.revealed .rlabel { color: var(--gold); }

    /* ── Spin button ── */
    .spin-btn {
      padding: 13px 40px;
      border-radius: 50px;
      background: var(--gold);
      color: var(--dark);
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 8px;
      transition: opacity 0.2s, transform 0.1s, background 0.2s;
    }

    .spin-btn:hover { opacity: 0.9; background: #d9a930; }
    .spin-btn:active { transform: scale(0.97); }
    .spin-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── Right column ── */
    .right-col {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── Name selection ── */
    .name-section {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: none;
    }

    .name-section.visible { display: block; }

    .name-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .name-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .name-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(201,150,42,0.2);
      background: var(--dark3);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
    }

    .name-btn:hover {
      background: rgba(201,150,42,0.12);
      border-color: var(--gold);
    }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      flex-shrink: 0;
    }

    /* ── Assignments ── */
    .assignments {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: none;
    }

    .assignments.visible { display: block; }

    .assignments h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .assign-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 6px;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .a-pos {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--gold-lt);
      min-width: 36px;
    }

    .a-arrow { color: var(--muted); font-size: 16px; flex-shrink: 0; }

    .a-name {
      font-weight: 500;
      font-size: 14px;
      flex: 1;
    }

    /* ── Done banner ── */
    .done-banner {
      background: rgba(46,204,113,0.1);
      border: 1px solid rgba(46,204,113,0.4);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
      color: var(--success);
      display: none;
    }

    .done-banner.visible { display: block; }
    .done-banner .done-icon { font-size: 32px; margin-bottom: 8px; }
    .done-banner h2 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      margin-bottom: 4px;
    }
    .done-banner p { font-size: 13px; opacity: 0.8; }

    /* ── Confetti canvas ── */
    #confetti {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
      display: none;
    }

    /* ── Divider ── */
    .divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    @media (max-width: 680px) {
      .divider { display: none; }
      .wheel-wrap { width: min(92vw, 280px); }
      .hub { width: 64px; height: 64px; }
      .pointer { right: -16px; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-right: 24px solid #c0392b; }
    }

    @media (max-width: 420px) {
      header h1 { font-size: 22px; }
      header p { font-size: 12px; }
      .spin-btn { width: 100%; padding: 14px 18px; font-size: 16px; }
      .name-btn { padding: 12px 14px; font-size: 15px; }
      .result-card .rvalue { font-size: 32px; }
      .a-pos { font-size: 18px; }
      .hub { width: 72px; height: 72px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-ring">💰</div>
  <h1>SAVEME Group</h1>
  <p>Cycle 2 — Position Draw &nbsp;·&nbsp; Spin to assign sitting order</p>
</header>

<div class="layout">

  <!-- Left: Wheel -->
  <div class="wheel-col">
    <div class="wheel-wrap">
      <canvas id="wheelCanvas"></canvas>
      <div class="pointer"></div>
      <div class="hub" id="hub" onclick="spin()">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9"/><polyline points="21 3 21 9 15 9"/></svg>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="rlabel">Position drawn</div>
      <div class="rvalue" id="posValue">—</div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">
      &#8635; Spin the wheel
    </button>
  </div>

  <div class="divider"></div>

  <!-- Right: name pick + assignments -->
  <div class="right-col">

    <div class="name-section" id="nameSection">
      <h3 id="nameLabel">Who spun? Select the member:</h3>
      <div class="name-grid" id="nameGrid"></div>
    </div>

    <div class="assignments" id="assignmentsBox">
      <h3>Assigned positions</h3>
      <div id="assignList"></div>
    </div>

    <div class="done-banner" id="doneBanner">
      <div class="done-icon">🎉</div>
      <h2>All positions assigned!</h2>
      <p>Cycle 2 sitting order is now set.</p>
    </div>

  </div>
</div>

<canvas id="confetti"></canvas>

<script>
  /* ─── Data ─── */
  const MEMBERS = [
    { name: "Alex",    initials: "AL", bg: "#1A4A7A", fg: "#a8d4f5" },
    { name: "Michael", initials: "MI", bg: "#3B2278", fg: "#c9b8f5" },
    { name: "Joseph",  initials: "JO", bg: "#145A38", fg: "#82e0aa" },
    { name: "Jimmy",   initials: "JI", bg: "#7A3A08", fg: "#f5c97a" },
    { name: "Shepherd",initials: "SH", bg: "#7a1a1a", fg: "#f5a8a8" },
  ];

  const ORDINALS = ["1st","2nd","3rd","4th","5th","6th"];

  /* wheel segment colours — rich jewel tones */
  const SEG = [
    { fill: "#1a4a7a", text: "#a8d4f5" },
    { fill: "#3b2278", text: "#c9b8f5" },
    { fill: "#7a3a08", text: "#f5c97a" },
    { fill: "#145a38", text: "#82e0aa" },
    { fill: "#7a1a1a", text: "#f5a8a8" },
  ];

  /* positions still available on the wheel */
  let positionsLeft = MEMBERS.map((_, i) => i); // [0,1,2,3] → ordinals
  let membersLeft   = [...MEMBERS];
  let assignments   = [];    // { posIdx, member }

  let angle    = 0;
  let spinning = false;
  let spun     = false;  // waiting for name pick
  let drawnPos = null;   // index into ORDINALS of the position that stopped at pointer

  const cv  = document.getElementById('wheelCanvas');
  const ctx = cv.getContext('2d');
  let CX = 0, CY = 0, R = 0;

  function resizeCanvas() {
    const wrap = document.querySelector('.wheel-wrap');
    const size = Math.floor(Math.min(wrap.clientWidth, window.innerWidth * 0.94));
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    cv.style.width = size + 'px';
    cv.style.height = size + 'px';
    cv.width  = Math.floor(size * dpr);
    cv.height = Math.floor(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = size / 2;
    CY = size / 2;
    R = CX - 10;
    drawWheel();
  }

  window.addEventListener('resize', () => { clearTimeout(window._wheelResize); window._wheelResize = setTimeout(resizeCanvas, 120); });

  /* ─── Draw wheel ─── */
  function drawWheel() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const n = positionsLeft.length;
    if (n === 0) return;

    const seg = (Math.PI * 2) / n;

    for (let i = 0; i < n; i++) {
      const posIdx = positionsLeft[i];
      const start  = angle + i * seg - Math.PI / 2;
      const end    = start + seg;
      const col    = SEG[i % SEG.length];

      /* segment fill */
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, start, end);
      ctx.closePath();
      ctx.fillStyle = col.fill;
      ctx.fill();
      ctx.strokeStyle = "#0f1117";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      /* position label */
      const mid = start + seg / 2;
      const tx  = CX + (R * 0.62) * Math.cos(mid);
      const ty  = CY + (R * 0.62) * Math.sin(mid);
      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(mid + Math.PI / 2);
      ctx.fillStyle = col.text;
      ctx.font = "bold 18px 'Playfair Display', serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(ORDINALS[posIdx], 0, 0);
      ctx.restore();
    }

    /* outer ring */
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(201,150,42,0.5)";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  /* ─── Which segment is at the pointer (right, 3 o'clock = angle 0) ─── */
  function getPointedSegment() {
    const n   = positionsLeft.length;
    const seg = (Math.PI * 2) / n;
    /* pointer is at 3 o'clock = 0 radians.
       Segment i starts at: angle + i*seg - π/2.
       We need: (pointer_angle - (angle - π/2)) mod 2π to find idx */
    let a = ((0 - angle + Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / seg) % n;
  }

  /* returns index and whether the pointer landed near a segment boundary */
  function getPointedSegmentInfo() {
    const n   = positionsLeft.length;
    const seg = (Math.PI * 2) / n;
    let a = ((0 - angle + Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    let idx = Math.floor(a / seg) % n;
    let rem = a - idx * seg;
    const eps = 0.03; // radians tolerance for "on the line"
    const onLine = rem < eps || rem > (seg - eps);
    return { idx, onLine, rem, seg };
  }

  /* ─── Spin ─── */
  function spin() {
    if (spinning || spun || positionsLeft.length === 0) return;
    spinning = true;
    document.getElementById('hub').classList.add('spinning');
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('resultCard').classList.remove('revealed');
    document.getElementById('posValue').textContent = '—';
    document.getElementById('nameSection').classList.remove('visible');

    const revolutions = 5 + Math.random() * 5;
    const targetDelta = Math.PI * 2 * revolutions;
    const start    = performance.now();
    const duration = 3000 + Math.random() * 1500; // ms

    function ease(t) {
      /* ease out cubic */
      return 1 - Math.pow(1 - t, 3);
    }

    const startAngle = angle;

    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(elapsed / duration, 1);
      angle = startAngle + targetDelta * ease(t);
      drawWheel();

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        /* done spinning */
        spinning = false;
        spun = true;
        document.getElementById('hub').classList.remove('spinning');

        const info = getPointedSegmentInfo();
        if (info.onLine) {
          const card = document.getElementById('resultCard');
          const label = card.querySelector('.rlabel') || document.querySelector('.rlabel');
          label.textContent = 'Border hit — please retry';
          card.classList.add('revealed');
          document.getElementById('spinBtn').disabled = false;
          spun = false;
          drawnPos = null;
          setTimeout(() => { label.textContent = 'Position drawn'; card.classList.remove('revealed'); }, 1400);
        } else {
          const segIdx = info.idx;
          drawnPos     = positionsLeft[segIdx];   // actual ordinal index (e.g. 0 = "1st")
          showResult(drawnPos);
        }
      }
    }

    requestAnimationFrame(frame);
  }

  /* ─── Show result & name picker ─── */
  function showResult(posIdx) {
    const card = document.getElementById('resultCard');
    document.getElementById('posValue').textContent = ORDINALS[posIdx];
    card.classList.add('revealed');

    /* last member — auto assign */
    if (membersLeft.length === 1) {
      setTimeout(() => assign(0), 500);
      return;
    }

    /* build name buttons */
    const grid  = document.getElementById('nameGrid');
    grid.innerHTML = '';
    membersLeft.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.className = 'name-btn';
      btn.innerHTML = `
        <span class="avatar" style="background:${m.bg};color:${m.fg}">${m.initials}</span>
        ${m.name}
      `;
      btn.onclick = () => assign(i);
      grid.appendChild(btn);
    });

    document.getElementById('nameSection').classList.add('visible');
  }

  /* ─── Assign position to member ─── */
  function assign(memberIdx) {
    const member = membersLeft[memberIdx];
    const posIdx = drawnPos;

    /* record */
    assignments.push({ posIdx, member });

    /* remove that POSITION from the wheel */
    const wheelIdx = positionsLeft.indexOf(posIdx);
    if (wheelIdx !== -1) positionsLeft.splice(wheelIdx, 1);

    /* remove that MEMBER from the picker */
    membersLeft.splice(memberIdx, 1);

    /* update UI */
    document.getElementById('nameSection').classList.remove('visible');
    document.getElementById('resultCard').classList.remove('revealed');
    document.getElementById('posValue').textContent = '—';
    spun = false;
    drawnPos = null;
    drawWheel();
    addAssignRow(posIdx, member);

    // If there's exactly one position and one member left, auto-assign it now
    if (positionsLeft.length === 1 && membersLeft.length === 1) {
      const lastPos = positionsLeft[0];
      const lastMember = membersLeft[0];
      assignments.push({ posIdx: lastPos, member: lastMember });
      // remove remaining
      positionsLeft.splice(0, 1);
      membersLeft.splice(0, 1);
      addAssignRow(lastPos, lastMember);
      drawWheel();
      finish();
      return;
    }

    if (membersLeft.length === 0) {
      finish();
    } else {
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('spinBtn').textContent = '↻ Spin again';
    }
  }

  /* ─── Add assignment row ─── */
  function addAssignRow(posIdx, member) {
    const box = document.getElementById('assignmentsBox');
    box.classList.add('visible');
    const row = document.createElement('div');
    row.className = 'assign-row';
    row.innerHTML = `
      <span class="a-pos">${ORDINALS[posIdx]}</span>
      <span class="a-arrow">→</span>
      <span class="a-name">${member.name}</span>
      <span class="avatar" style="background:${member.bg};color:${member.fg};width:28px;height:28px;font-size:10px">${member.initials}</span>
    `;
    document.getElementById('assignList').appendChild(row);
  }

  /* ─── All done ─── */
  function finish() {
    document.getElementById('spinBtn').style.display = 'none';
    document.getElementById('doneBanner').classList.add('visible');
    launchConfetti();
  }

  /* ─── Confetti ─── */
  function launchConfetti() {
    const cc = document.getElementById('confetti');
    cc.width  = window.innerWidth;
    cc.height = window.innerHeight;
    cc.style.display = 'block';
    const c  = cc.getContext('2d');
    const COLORS = ['#c9962a','#f0d07a','#2ecc71','#3498db','#9b59b6','#e74c3c','#f39c12'];
    const pieces = Array.from({ length: 100 }, () => ({
      x:  Math.random() * cc.width,
      y: -20 - Math.random() * 80,
      w:  6 + Math.random() * 8,
      h:  10 + Math.random() * 12,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      rv:  (Math.random() - 0.5) * 0.15,
      col: COLORS[Math.floor(Math.random() * COLORS.length)],
    }));

    let frame = 0;
    function draw() {
      c.clearRect(0, 0, cc.width, cc.height);
      pieces.forEach(p => {
        c.save();
        c.translate(p.x, p.y);
        c.rotate(p.rot);
        c.fillStyle = p.col;
        c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        c.restore();
        p.x   += p.vx;
        p.y   += p.vy;
        p.vy  += 0.05;
        p.rot += p.rv;
        if (p.y > cc.height + 20) {
          p.y = -20;
          p.x = Math.random() * cc.width;
          p.vy = 2 + Math.random() * 4;
        }
      });
      frame++;
      if (frame < 220) requestAnimationFrame(draw);
      else { c.clearRect(0, 0, cc.width, cc.height); cc.style.display = 'none'; }
    }
    requestAnimationFrame(draw);
  }

  /* ─── Init ─── */
  resizeCanvas();
</script>
</body>
</html>
